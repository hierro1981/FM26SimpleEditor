name: Validate comparison (DLL only)

on:
  push:
    branches: [main, v12, v13]
    paths: ["**/*.cs", "**/*.csproj", "**/*.resx", ".github/workflows/validate.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Compile DLLs and run comparison checks
        shell: pwsh
        run: |
          dotnet run --project tests/ComparisonChecks/ComparisonChecks.csproj --configuration Release -p:UseAppHost=false
          if ($LASTEXITCODE -ne 0) { throw "Comparison checks failed." }
          if (Get-ChildItem -Recurse -File -Include FM26SimpleEditor.exe,ComparisonChecks.exe,*.zip) {
            throw "Validation must not generate application EXEs or ZIPs."
          }

