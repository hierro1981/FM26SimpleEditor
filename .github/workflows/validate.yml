name: Validate comparison (DLL only)

on:
  push:
    branches: [main, v12, v13, v14]
    paths: ["**/*.cs", "**/*.csproj", "**/*.resx", "**/*.py", "Data/*.json", ".github/workflows/validate.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check Python backend
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Python dependencies failed." }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Python checks failed." }
      - name: Compile DLLs and run comparison checks
        shell: pwsh
        run: |
          dotnet run --project tests/ComparisonChecks/ComparisonChecks.csproj --configuration Release -p:UseAppHost=false
          if ($LASTEXITCODE -ne 0) { throw "Comparison checks failed." }
          if (Get-ChildItem -Recurse -File -Include FM26SimpleEditor.exe,ComparisonChecks.exe,*.zip) {
            throw "Validation must not generate application EXEs or ZIPs."
          }

